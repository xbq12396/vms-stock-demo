<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>VMS 模拟交易台</title>
  <style>
    :root{--red:#f21f35;--red2:#ff4b5b;--ink:#171717;--muted:#8b8d94;--line:#ececf0;--bg:#f5f6f8;--green:#18a64a;--blue:#2685e8;--gold:#dd9d09}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:var(--ink)}
    button,input{font:inherit}button{border:0;background:none;cursor:pointer}.app{width:100%;max-width:520px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 30px #00000012;position:relative;padding-bottom:72px}.top{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f5c83e,#ad6b00);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 3px #fff8}.brand b{font-size:22px;letter-spacing:1px}.brand small{display:block;font-size:9px;letter-spacing:4px;color:#555;margin-top:2px}.top-actions{display:flex;gap:14px}.icon-btn{width:40px;height:40px;border-radius:9px;background:#1737e9;color:#fff;font-size:22px;display:grid;place-items:center}.icon-btn.agent{background:#fff;color:#e52332;font-size:30px}
    .hero{background:linear-gradient(150deg,#f51d36,#ff5260);padding:14px 14px 18px}.search{height:56px;border-radius:12px;background:#ff6775;color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;font-size:18px}.search input{flex:1;border:0;outline:0;background:transparent;color:#fff;font-size:17px}.search input::placeholder{color:#fff}.indices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;margin:14px -14px -18px;padding:18px 10px 20px;text-align:center}.index .num{font-size:26px;font-weight:500;color:#cf1823}.index.down .num,.index.down .delta{color:var(--green)}.index .delta{font-size:15px;margin-top:10px;color:#cf1823}.index label{display:block;font-size:17px;font-weight:700;margin-top:10px}
    .section{padding:16px 16px 0}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 10px;text-align:center}.shortcut{font-size:13px}.shortcut .bubble{margin:auto auto 8px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:27px}.green{background:#3bd211}.orange{background:#e1a800}.blue{background:#2986db}.cyan{background:#18c2b2}.red{background:#ef2939}.shortcut span{display:block;white-space:nowrap}.notice{margin:18px -16px 0;padding:12px 16px;color:#d98a14;background:#fff9ed;font-size:14px;white-space:nowrap;overflow:hidden}.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;font-size:20px;font-weight:700}.section-title span{font-size:14px;font-weight:400;color:#333}.section-title span:after{content:'›';font-size:23px;margin-left:4px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stock-card{padding:14px 8px;border-radius:9px;background:#fff;box-shadow:0 3px 14px #00000018;text-align:center}.stock-card b{font-size:16px}.stock-card strong{display:block;color:#d81c2a;font-size:23px;margin-top:12px}.stock-card small{color:#d81c2a;font-size:14px}.tabs{display:flex;justify-content:space-around;border-bottom:1px solid var(--line);margin:22px -16px 0}.tabs button{padding:13px 8px;font-weight:600;position:relative}.tabs button.active{color:#d81c2a}.tabs button.active:after{content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:3px;background:#d81c2a}.news{padding:14px 0}.news h3{font-size:16px;line-height:1.6;margin:0}.news p{color:#92949b;margin:5px 0;font-size:13px}.news + .news{border-top:1px solid var(--line)}
    .page{padding:18px 16px}.page h1{font-size:24px;margin:6px 0 18px}.back-row{display:flex;align-items:center;gap:14px}.back{font-size:31px;line-height:1}.page-sub{color:var(--muted);font-size:13px;margin:-10px 0 16px}.list-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.list-row .meta{color:#666;font-size:13px;line-height:1.8}.price{font-size:19px;color:#d81c2a;text-align:right}.pill{padding:9px 15px;border-radius:20px;background:#f21f35;color:#fff}.chart{height:180px;border-radius:12px;background:linear-gradient(180deg,#fff1f3,#fff);position:relative;overflow:hidden;margin:10px 0 18px}.chart svg{width:100%;height:100%}.trade-box{border:1px solid var(--line);border-radius:12px;padding:15px}.field{display:flex;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;gap:8px}.field label{width:60px;color:#666}.field input{border:0;outline:0;flex:1;text-align:right}.cta{width:100%;background:#f21f35;color:#fff;border-radius:8px;padding:13px;margin-top:15px;font-weight:700}.cta.secondary{background:#fff0f1;color:#d81c2a}.balance{display:flex;justify-content:space-between;background:#fff8eb;border-radius:10px;padding:14px;margin-bottom:16px}.balance b{color:#d88900;font-size:22px}.investor{border-bottom:1px solid var(--line);padding:15px 0;position:relative}.investor h3{margin:0 0 7px}.investor p{margin:4px 100px 4px 0;font-size:13px;color:#555;line-height:1.6}.investor .follow{position:absolute;right:4px;top:38px;background:#f21f35;color:#fff;width:58px;height:58px;border-radius:50%;font-weight:700}.help{border:1px solid #ddd;border-radius:10px;padding:14px;margin-top:20px;line-height:1.9;color:#555}.help b{display:inline-block;background:#de9708;color:#fff;padding:6px 18px;margin:-14px 0 12px -14px;border-radius:10px 0 10px 0}.qr{display:block;width:180px;height:180px;border:9px solid #fff;box-shadow:0 2px 10px #0002;margin:10px auto 15px;image-rendering:pixelated}.admin{background:#f8f9fb;border-radius:12px;padding:14px;margin-top:18px}.admin h3{margin:0 0 10px}.admin input[type=text]{width:100%;padding:10px;border:1px solid #ddd;border-radius:7px}.switch{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.switch input{width:20px;height:20px}.demo-note{font-size:12px;color:#a36c00;background:#fff7de;border-radius:7px;padding:9px;margin:12px 0;line-height:1.6}.empty{padding:35px 10px;text-align:center;color:#999}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;height:70px;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid #e8e8eb;z-index:10}.bottom button{color:#92949a;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottom button b{font-size:23px;font-weight:400;line-height:1}.bottom button.active{color:#f21f35}
    @media(min-width:521px){.app{min-height:900px;margin-top:15px;border-radius:20px;overflow:hidden}.bottom{border-radius:0 0 20px 20px}}
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <nav class="bottom" id="bottom"></nav>
  <script>
    const state={page:'home',stock:'600519',balance:Number(localStorage.getItem('demoBalance')||50000),qr:localStorage.getItem('demoQr')||'DEMO-PAYMENT-ONLY'};
    const stocks=[['600519','贵州茅台','1682.00','+1.32%'],['000001','平安银行','11.46','-0.26%'],['300750','宁德时代','192.82','+2.15%'],['600036','招商银行','35.80','+0.74%'],['601318','中国平安','46.12','-0.38%']];
    const investors=[['杨超','中国银河证券首席策略分析师','3年','月总收益58%以上'],['郭磊','广发证券首席经济学家','2年','月总收益59%以上'],['余志华','鼎珮集团独立董事','4年','连续3年实现月涨幅超60%']];
    const iconMap={home:'⌂',market:'◉',trade:'▤',follow:'⌕',me:'▣'};
    function money(v){return Number(v).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function header(){return `<header class="top"><div class="brand"><div class="brand-mark">MS</div><div><b>VMS 模拟交易</b><small>VMS DEMO INVEST</small></div></div><div class="top-actions"><button class="icon-btn">♧</button><button class="icon-btn agent">♙</button></div></header>`}
    function nav(){return ['home:首页','market:行情','trade:交易','follow:跟投','me:我的'].map(x=>{let [k,t]=x.split(':');return `<button data-page="${k}" class="${state.page===k?'active':''}"><b>${iconMap[k]}</b>${t}</button>`}).join('')}
    function home(){return `${header()}<section class="hero"><div class="search">⌕<input id="search" placeholder="输入股票名称/代码" /></div><div class="indices">${[['3500.62','-4.38  -0.12%','上证指数','down'],['10755.85','11.29  0.11%','深证成指',''],['2243.08','8.03  0.36%','创业板指','']].map(i=>`<div class="index ${i[3]}"><div class="num">${i[0]}</div><div class="delta">${i[1]}</div><label>${i[2]}</label></div>`).join('')}</div></section><section class="section"><div class="shortcuts">${[['📝','配资申请','green'],['☑','我的自选','orange'],['▥','我的持仓','blue'],['♙','在线客服','blue'],['◉','有奖邀请','orange'],['＄','模拟充值','red'],['☷','交易规则','green'],['▥','关于我们','cyan']].map(x=>`<button class="shortcut" data-action="${x[1]}"><div class="bubble ${x[2]}">${x[0]}</div><span>${x[1]}</span></button>`).join('')}</div><div class="notice">◀ 恭喜用户 139****7451，合伙人等级提升至 VIP8（演示消息）</div><div class="section-title">精选股票<span data-page="market">查看更多</span></div><div class="cards">${stocks.slice(0,3).map(s=>`<button class="stock-card" data-stock="${s[0]}"><b>${s[1]}</b><strong>${s[2]}</strong><small>${s[3]}</small></button>`).join('')}</div><div class="tabs"><button class="active">证券要闻</button><button>国际经济</button><button>国内经济</button><button>公司资讯</button></div><article class="news"><h3>创业板指上游0.36% 机器人产业链涨幅居前</h3><p>东方财富 Choice 数据 · 2025-07-11 11:20:25</p></article><article class="news"><h3>保险、银行板块盘中震荡，市场关注成交量变化</h3><p>模拟资讯，仅用于界面演示</p></article></section>`}
    function market(){return `${header()}<section class="page"><h1>行情</h1><div class="search" style="background:#f3f4f7;color:#999;margin-bottom:12px">⌕<input id="marketSearch" style="color:#222" placeholder="搜索股票名称/代码" /></div><div id="marketList">${stocks.map(s=>`<button class="list-row" data-stock="${s[0]}" style="width:100%;text-align:left"><div><b>${s[1]}</b><div class="meta">${s[0]} · 沪深 A 股</div></div><div><div class="price">${s[2]}</div><div class="meta" style="color:${s[3][0]=='-'?'#18a64a':'#d81c2a'}">${s[3]}</div></div></button>`).join('')}</div></section>`}
    function trade(){let s=stocks.find(x=>x[0]===state.stock)||stocks[0];return `${header()}<section class="page"><div class="back-row"><button class="back" data-page="market">‹</button><h1 style="margin:0">交易</h1></div><div class="demo-note">当前为模拟交易：不会提交真实委托，不会连接券商或扣除真实资金。</div><div class="chart"><svg viewBox="0 0 500 180" preserveAspectRatio="none"><polyline points="0,136 48,126 82,142 128,110 164,120 204,74 254,96 294,67 336,90 378,38 420,56 460,23 500,40" fill="none" stroke="#ed2a3d" stroke-width="4"/><line x1="0" y1="145" x2="500" y2="145" stroke="#f0d8dc"/></svg></div><div class="trade-box"><div class="field"><label>股票</label><b>${s[1]} (${s[0]})</b></div><div class="field"><label>价格</label><input id="price" type="number" value="${s[2]}" step="0.01" /></div><div class="field"><label>数量</label><input id="qty" type="number" value="100" step="100" min="100" /></div><div class="field"><label>方向</label><select id="side" style="border:0;flex:1;text-align:right"><option value="buy">买入</option><option value="sell">卖出</option></select></div><button class="cta" id="placeOrder">提交模拟委托</button></div><div class="balance"><span>模拟可用余额</span><b>¥ ${money(state.balance)}</b></div></section>`}
    function follow(){return `${header()}<section class="page"><div class="back-row"><button class="back" data-page="home">‹</button><h1 style="margin:0">跟投</h1></div><div class="search" style="background:#f3f4f7;color:#999;margin:12px 0 5px">⌕<input placeholder="明星投资者姓名" /></div>${investors.map(i=>`<article class="investor"><h3>明星投资者：${i[0]}</h3><p>操盘师：${i[0]}<br/>就职于：${i[1]}<br/>投资时长：${i[2]}<br/>特别说明：${i[3]}</p><button class="follow" data-follow="${i[0]}">跟</button></article>`).join('')}<div class="help"><b>跟投如何运作？</b><br/>在搜索框中输入想跟投的明星投资者昵称，点击“跟”进入申请页面。<br/><br/>跟投资金和收益均为演示数据，真实投资请通过持牌机构办理。</div></section>`}
    function me(){return `${header()}<section class="page"><h1>我的</h1><div class="balance"><div><span>模拟账户余额</span><b style="display:block">¥ ${money(state.balance)}</b></div><button class="pill" data-action="模拟充值">充值</button></div><button class="list-row" data-action="模拟充值" style="width:100%"><span>模拟充值 / QR 配置</span><b>›</b></button><button class="list-row" style="width:100%"><span>我的订单</span><b>›</b></button><button class="list-row" style="width:100%"><span>风险提示与交易规则</span><b>›</b></button><div class="admin"><h3>后台演示控制台</h3><div class="demo-note">仅用于前端演示：可调整模拟余额与二维码文案，不接收真实付款。</div><div class="field"><label>增加余额</label><input id="adminAmount" type="number" value="10000" min="0" /></div><button class="cta" id="adminAdd">给演示账户增加余额</button><div class="switch"><span>启用演示充值页</span><input id="enableQr" type="checkbox" checked /></div><label style="font-size:13px;color:#666">二维码内容（演示）</label><input id="qrValue" type="text" value="${state.qr}" /><button class="cta secondary" id="saveQr">保存演示二维码配置</button></div></section>`}
    function recharge(){return `${header()}<section class="page"><div class="back-row"><button class="back" data-page="me">‹</button><h1 style="margin:0">模拟充值</h1></div><div class="demo-note">这是沙盒充值页面。二维码仅作 UI 展示，不对应任何支付账户，也不会产生真实入账。</div><canvas id="qrPreview" class="qr" width="180" height="180" aria-label="模拟二维码预览"></canvas><p style="text-align:center;color:#666;font-size:13px">请联系演示管理员确认模拟入账</p><div class="trade-box"><div class="field"><label>充值金额</label><input id="rechargeAmount" type="number" value="1000" min="1" /></div><button class="cta" id="rechargeBtn">提交模拟充值申请</button></div></section>`}
    function drawQrPreview(){let canvas=document.querySelector('#qrPreview');if(!canvas)return;let ctx=canvas.getContext('2d'),size=29,cell=canvas.width/size,seed=2166136261;for(let ch of state.qr)seed=Math.imul(seed^ch.charCodeAt(0),16777619);let finder=(x,y)=>{ctx.fillStyle='#111';ctx.fillRect(x*cell,y*cell,7*cell,7*cell);ctx.fillStyle='#fff';ctx.fillRect((x+1)*cell,(y+1)*cell,5*cell,5*cell);ctx.fillStyle='#111';ctx.fillRect((x+2)*cell,(y+2)*cell,3*cell,3*cell)};ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<size;y++)for(let x=0;x<size;x++){let reserved=(x<8&&y<8)||(x>20&&y<8)||(x<8&&y>20);seed=(Math.imul(seed,1664525)+1013904223)>>>0;if(!reserved&&(seed&3)!==0){ctx.fillStyle='#111';ctx.fillRect(Math.floor(x*cell),Math.floor(y*cell),Math.ceil(cell),Math.ceil(cell))}}finder(1,1);finder(21,1);finder(1,21)}
    function render(){let body=state.page==='home'?home():state.page==='market'?market():state.page==='trade'?trade():state.page==='follow'?follow():state.page==='me'?me():recharge();document.querySelector('#app').innerHTML=body;document.querySelector('#bottom').innerHTML=nav();drawQrPreview();bind()}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});document.querySelectorAll('[data-stock]').forEach(b=>b.onclick=()=>{state.stock=b.dataset.stock;state.page='trade';render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='模拟充值')state.page='recharge';render()});document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>{b.textContent='已跟';b.style.background='#999';alert('已提交模拟跟投申请')});document.querySelector('#placeOrder')?.addEventListener('click',()=>{let amount=Number(document.querySelector('#price').value)*Number(document.querySelector('#qty').value);if(document.querySelector('#side').value==='buy'&&amount>state.balance){alert('模拟余额不足');return}state.balance+=document.querySelector('#side').value==='buy'?-amount:amount;localStorage.setItem('demoBalance',state.balance);alert('模拟委托已提交');render()});document.querySelector('#rechargeBtn')?.addEventListener('click',()=>{let a=Number(document.querySelector('#rechargeAmount').value);if(a>0){state.balance+=a;localStorage.setItem('demoBalance',state.balance);alert('模拟充值已入账');state.page='me';render()}});document.querySelector('#adminAdd')?.addEventListener('click',()=>{let a=Number(document.querySelector('#adminAmount').value);state.balance+=a;localStorage.setItem('demoBalance',state.balance);alert('已增加模拟余额');render()});document.querySelector('#saveQr')?.addEventListener('click',()=>{state.qr=document.querySelector('#qrValue').value;localStorage.setItem('demoQr',state.qr);alert('演示二维码配置已保存');render()});document.querySelector('#marketSearch')?.addEventListener('input',e=>{let q=e.target.value.trim();document.querySelectorAll('#marketList .list-row').forEach(r=>r.style.display=r.innerText.includes(q)?'flex':'none')});document.querySelector('#search')?.addEventListener('keydown',e=>{if(e.key==='Enter'){let s=stocks.find(x=>x[0]===e.target.value.trim());if(s){state.stock=s[0];state.page='trade';render()}}})}
    render();
  </script>
</body>
</html>
